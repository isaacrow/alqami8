<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALQAMI Recognition Bench</title>
    <style>
      :root { color-scheme: light dark; --bg: #f5f5f4; --fg: #1c1917; --muted: #57534e; --card: #ffffff; --line: #d6d3d1; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --card: #1c1917; --line: #44403c; } }
      body { margin: 0; padding: 20px 16px 40px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
      main { max-width: 640px; margin: 0 auto; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      p { color: var(--muted); margin: 0 0 16px; }
      button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 999px; border: 0; background: var(--fg); color: var(--bg); }
      button:disabled { opacity: .5; }
      table { width: 100%; border-collapse: collapse; margin-top: 18px; background: var(--card); border-radius: 12px; overflow: hidden; }
      td { padding: 9px 12px; border-bottom: 1px solid var(--line); }
      td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
      #log { white-space: pre-wrap; font: 12px/1.5 ui-monospace, monospace; color: var(--muted); margin-top: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Recognition bench</h1>
      <p>Runs ALQAMI's recognition model on this device against Moon's covers. Open it on the iPhone, tap Run, and send the numbers.</p>
      <button id="run">Run</button>
      <label style="margin-left:12px"><input type="checkbox" id="gpu" /> WebGPU</label>
      <table id="results" hidden></table>
      <div id="log"></div>
    </main>
    <script type="module" src="/src/bench/sightBench.ts"></script>
  </body>
</html>
