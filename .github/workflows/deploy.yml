name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Nightly, so records newly published in Moon become recognisable by sight.
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache the recognition model
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: transformers-dinov2-small-q8

      # Every 3D object rendered from 36 angles all around (Chrome is preinstalled on the runner), so scan mode
      # recognises statues and objects from any side and can say which side is in view.
      - name: Render 3D objects from all around
        run: node scripts/render-object-views.mjs || echo "Renders not made; the index keeps covers and photos only."

      # Rebuilds public/data/recognition-dinov2s.json from Moon's covers, enrol/ and renders/. If Moon cannot be reached,
      # the committed index is kept and the site still deploys.
      - name: Build recognition index
        run: |
          node scripts/build-recognition-index.mjs || echo "Recognition index not rebuilt; keeping the committed one."
          INDEX_DTYPE=fp16 node scripts/build-recognition-index.mjs || echo "WebGPU index not rebuilt; keeping the committed one."

      # Image-tracking markers for Moon covers (pinned cards). Each takes ~10 s, so they are kept in the cache and
      # each run makes only new ones (up to 60); the nightly run fills in the rest. A failure keeps what is cached.
      - name: Restore cover markers
        uses: actions/cache@v4
        with:
          path: public/nft
          key: nft-markers-${{ github.run_id }}
          restore-keys: nft-markers-

      - name: Build cover markers
        run: node scripts/build-nft-targets.mjs || echo "Cover markers not updated; keeping the cached ones."

      # The site does not deploy with type errors (they were 9, one a likely crash, before 2026-11-14).
      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Build project
        run: npm run build
        env:
          # Set once from a terminal: node scripts/set-gemini-key.mjs (the Jawahiri character talks with it).
          VITE_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          # His cloned-voice server (the owner's PC behind a tunnel); set by start-voice on that PC. Empty = Gemini voice.
          VITE_VOICE_SERVER: ${{ vars.VOICE_SERVER_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
